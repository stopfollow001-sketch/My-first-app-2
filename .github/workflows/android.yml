name: Build LoopLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project ZIP
        run: |
          unzip -o LoopLiveAndroid-Foreground-AutoReconnect.zip -d extracted
          find extracted -name settings.gradle.kts -print
          ROOT=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          cp -r "$ROOT"/. .
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopLive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
